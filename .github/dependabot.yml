version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    groups:
      androidx-compose:
        patterns:
          - "androidx.compose*"
      # Test and benchmark artifacts are versioned in lockstep; keep them together.
      androidx-test:
        patterns:
          - "androidx.test*"
          - "androidx.benchmark*"
      androidx-other:
        patterns:
          - "androidx.*"
    ignore:
      # AGP and Kotlin majors are deliberate, tested migrations, not drive-by bumps.
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
