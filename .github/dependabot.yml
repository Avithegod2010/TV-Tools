version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    groups:
      androidx-compose:
        patterns:
          - "androidx.compose*"
      # Test and benchmark artifacts are versioned in lockstep; keep them together.
      androidx-test:
        patterns:
          - "androidx.test*"
          - "androidx.benchmark*"
      androidx-other:
        patterns:
          - "androidx.*"
    ignore:
      # AGP and Kotlin majors are deliberate, tested migrations, not drive-by bumps.
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major"]
      # The plugin id is a separate dependency from the artifact above; without
      # this entry Dependabot proposes AGP 9.x, which needs Gradle 9 + compileSdk 37.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      # Gradle 9 is only supported by AGP 9. The wrapper stays on 8.9 until the
      # toolchain migration happens as one reviewed change.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # kotlinx-coroutines >=1.10 is compiled with Kotlin 2.1/2.2 metadata; this
      # project compiles with Kotlin 2.0.21 and fails with "Module was compiled
      # with an incompatible version of Kotlin ... metadata is 2.2.0".
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-android"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # androidx releases increasingly require compileSdk 36/37 or AGP 9.1+. This
      # project builds against compileSdk 35 / AGP 8.7.3, so only patch updates are
      # safe to auto-propose; minor+major androidx bumps go through the toolchain
      # migration branch where the release build is verified.
      - dependency-name: "androidx.*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
