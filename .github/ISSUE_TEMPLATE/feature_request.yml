name: Feature request
description: Suggest a capability or an improvement.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        TV Tools is a local-only ADB client. Features that require an account, a cloud service or
        telemetry will not be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: "I want to … but today I have to …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connect / pairing
        - Remote & input
        - Apps
        - Files
        - Screen mirroring
        - Tools / Labs
        - Settings / theme
        - Documentation
        - Something else
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This feature works entirely on the local network and needs no account or cloud service.
          required: true
