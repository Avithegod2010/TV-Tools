# Memory-constrained machine tuning (tight commit budget right now)
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.vfs.watch=false
# Do not hard-code a JDK path here: CI uses its own JAVA_HOME.
# Local developers can set org.gradle.java.home in ~/.gradle/gradle.properties.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# R8 full mode is too slow/thrashy on this 8 GB dev box; shrinking still applies.
android.enableR8.fullMode=false
